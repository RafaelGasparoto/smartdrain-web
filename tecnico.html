<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Técnico</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #121212;
        color: #f8f9fa;
      }

      .bg-panel {
        background: #1f1f1f;
      }

      .hash-mono {
        font-size: 0.8rem;
        word-break: break-all;
        color: #adb5bd;
      }
    </style>
  </head>
  <body>
    <div class="container py-4" style="max-width: 640px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-white">Painel do Técnico</h1>
        <a href="./index.html" class="btn btn-sm btn-outline-secondary"
          >← Dashboard</a
        >
      </div>

      <div class="card bg-panel border-0 mb-4 shadow-sm">
        <div class="card-body">
          <p class="text-secondary small mb-2">
            Simula as requisições que o app do técnico enviaria, assinando
            com a chave de teste (Hardhat Account #1 — a mesma do
            <code>TECNICO_PRIVATE_KEY</code> no <code>.env</code> da API).
          </p>

          <label for="seletorChamado" class="form-label text-secondary small"
            >Chamado</label
          >
          <div class="d-flex gap-2 mb-3">
            <select
              id="seletorChamado"
              class="form-select bg-dark text-white border-secondary"
            ></select>
            <button
              id="botaoAtualizarLista"
              class="btn btn-outline-secondary"
              title="Atualizar lista"
            >
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>

          <div class="d-flex gap-2">
            <button id="botaoEmAndamento" class="btn btn-warning flex-fill">
              <i class="bi bi-tools me-1"></i>Marcar em andamento
            </button>
            <button
              id="botaoValidarManutencao"
              class="btn btn-info flex-fill"
            >
              <i class="bi bi-check2-circle me-1"></i>Validar manutenção
            </button>
          </div>
        </div>
      </div>

      <div class="card bg-panel border-0 shadow-sm">
        <div class="card-body">
          <h2 class="h6 text-white">Resultado</h2>
          <div id="resultado">
            <p class="text-secondary mb-0">
              Selecione um chamado e clique em uma ação.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./tecnico.js"></script>
  </body>
</html>
